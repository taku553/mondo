runtime: python312
entrypoint: gunicorn -b :$PORT py.main:app

env_variables:
  FLASK_APP: py.main.py
  APP_ENV: production
  SECRET_KEY: '[YOUR_SECRET_KEY]' # ランダムな文字列を生成して使用
  REDISHOST: '10.22.46.187'
  REDISPORT: '6379'
  #REDISHOST: 'redis-10902.c299.asia-northeast1-1.gce.redns.redis-cloud.com'
  #REDISPORT: '10902'
  #REDIS_PASSWORD: 'default:gujKdwZDtJCBkoO3IkFZiHrTv6mMDc59'

handlers:
- url: /robots.txt
  static_files: static/robots.txt
  upload: static/robots.txt

- url: /static
  static_dir: static
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Frame-Options: DENY
    X-XSS-Protection: "1; mode=block"
    X-Content-Type-Options: nosniff
    
- url: /(.*\.(gif|png|jpg|css|js|svg|ttc))$
  static_files: static/\1
  upload: static/.*\.(gif|png|jpg|css|js|svg|ttc)$
  http_headers:
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    X-Frame-Options: DENY
    X-XSS-Protection: "1; mode=block"
    X-Content-Type-Options: nosniff


- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301

  
instance_class: F1  # 最小インスタンスクラス、必要に応じて調整

automatic_scaling:
  min_instances: 2
  max_instances: 3  # トラフィックに応じて調整

vpc_access_connector:
 name: projects/crack-celerity-429215-a2/locations/asia-northeast1/connectors/myconnector
