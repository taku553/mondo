runtime: python
env: flex
entrypoint: gunicorn py.main:app

env_variables:
  FLASK_APP: "py.main.py"
  APP_ENV: "production"
  PYTHONPATH: "."  # これを追加

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 2  # Freeプランでは2に制限

handlers:
- url: /static
  static_dir: static
  secure: always  # HTTPSを強制
- url: /.*
  script: auto
  secure: always  # HTTPSを強制