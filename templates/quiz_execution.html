<!--問題画面のhtml-->
<!DOCTYPE html>
<html lang="ja">
<head>
    <!--文字エンコーディング-->
    <meta charset="UTF-8">
    <!--webページが画面幅に合わせて表示-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--ページタイトル-->
    <title>クイズ</title>
    <!--cssにリンク-->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="svg/x-icon">
    <!--フォントリンク-->
    <!--noto sans jp-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <!-- noto sefrif jp-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">

    <!-- adobe fonts のプロジェクトを読み込む-->
    <script>
        (function(d) {
          var config = {
            kitId: 'hdm6oce',
            scriptTimeout: 3000,
            async: true
          },
          h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
        })(document);
    </script>

    <!-- フォントをプリロード -->
    <link rel="preload" href="{{ url_for('static', filename='fonts/GenSekiGothic JP H.ttc') }}" as="font" type="font/ttf" crossorigin="anonymous">
    <!--ページのURL-->
    <a href="quiz_execution.html"></a>
    <style>
        @font-face {
            font-family: 'GenSekiGothic JP H';
            src: url("{{ url_for('static', filename='fonts/GenSekiGothic JP H.ttc') }}") format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; /* フォールバックフォントで即表示し、利用可能になればスワップ */
        }
    </style>
</head>
<body>
    <main>
        <!--クイズのコンテナ-->
        <section>
            <div class="q_e_container">
                <heading class="num" id="current-question-number">
                    第{{ current_question_index }}問
                </heading>
                <!--問題文-->
                <div id="question"></div>
                <!-- 選択肢のコンテナ -->
                <div id="choices_container">
                    <!-- 選択肢はjavascriptで動的に作成。クラス名は"choice"。 -->
                </div>
                <!--「次へ」ボタン-->
                <button id="next-button">次へ</button>
            </div>
        </section>
        <!--遷移ボタンのコンテナ-->
        <section>
            <div class="q_window_transition">
                <h4 class="q_window_restart_f">クイズやり直すにはこちら</h4>
                <button id="q_window_restart_b">やり直す</button>
                <h4 class="q_window_home_f">ホームへ戻るにはこちら</h4>
                <button id="q_window_home_b">ホームへ戻る</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="copyrights">
            <small >&copy; ngrjaku 2024</small>
        </div>
      </footer>

     <!-- 外部JavaScriptファイルをリンク -->
     <!--自作-->
     <script src="{{ url_for('static', filename='quiz_exe.js') }}"></script>
</body>
</html>
