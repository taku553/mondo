<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ quiz.title }}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="svg/x-icon">

    <!-- ページのURL -->
     <a href="quiz_info{{ quiz.id }}.html"></a>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BRFNLZKC9G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-BRFNLZKC9G');
    </script>

    <!-- jQueryスクリプト -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- adobe fonts のプロジェクトを読み込む-->
    <script>
        (function(d) {
          var config = {
            kitId: 'hdm6oce',
            scriptTimeout: 3000,
            async: true
          },
          h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
        })(document);
    </script>
</head>
<body>
    <main class="main">
        <div class="quiz-detail-container">
                <!-- ロゴ -->
                <div class="logo-container">
                    <a href="/" target="_self" rel="noopener noreferrer">
                        <div class="detail-logo">
                            <img class="logo" src="{{ url_for('static', filename='logo.svg') }}" alt="logo">
                        </div>                    
                    </a>
                </div>
                <!-- 画像 -->

                <div class="image-container">
                    <img src="{{ url_for('static', filename=quiz.image) }}" alt="画像" class="quiz_info_images">
                </div>
                <!-- タイトル -->
                <div class="quiz-detail-header">
                    <h1 class="quiz-detail-title">{{ quiz.title }}</h1>
                </div>

                <!-- タグと日付 -->
                <div class="tag-date-container">
                    <div class="grid_info">
                        {% for tag in quiz.tags %}
                                <span class="detail-tag">{{ tag }}</span>
                        {% endfor %}
                    </div>
                    <span class="creation-date">{{ quiz.date }}</span>
                </div>

                <!-- クイズ情報 -->
                <div class="quiz-info-box">
                    <ul class="info-list">
                        <li>ジャンル：{{ quiz.subject }}</li>
                        <li>出題範囲：{{ quiz.period }}</li>
                        <li>問題数：{{ quiz.total_questions }}問</li>
                    </ul>
                </div>

                <!-- クイズ概要 -->
                <div class="quiz-description">
                    <p>{{ quiz.description }}</p>
                </div>

                
                <!-- 非表示のセレクト要素 -->
                <select id="quiz_range" class="hidden">
                    <option value="{{ quiz.category }}">{{ quiz.title }}</option>
                </select>
                
                <!-- ボタン類 -->
                <div class="detail-buttons">
                    <button id="q_info_start_b">
                        <span class="start_b_location">スタート</span>
                    </button>
                    <button id="q_window_home_b">ホームへ戻る</button>
                </div>
                <!-- 広告スペース -->
                <!-- スマホ用の広告 -->
                <div id="im-3968b262e6294098b645853c659a7981">
                    <script async src="https://imp-adedge.i-mobile.co.jp/script/v1/spot.js?20220104"></script>
                    <script>(window.adsbyimobile=window.adsbyimobile||[]).push({pid:83780,mid:584896,asid:1902393,type:"banner",display:"inline",elementid:"im-3968b262e6294098b645853c659a7981"})</script>
                </div>
        </div>
    </main>

    <footer class="footer">
        <div class="sns_icon">
            <a href="https://x.com/taku_nuc" target="_blank" rel="noopener noreferrer">
                <img class="x" src="{{ url_for('static', filename='sns_logo/x-logo/logo-black.png') }}" alt="x">
            </a>
            <a href="https://www.instagram.com/taku_8862/" target="_blank" rel="noopener noreferrer">
                <img class="Instagram" src="{{ url_for('static', filename='sns_logo/Instagram/03 Black Glyph/Instagram_Glyph_Black.svg') }}" alt="Instagram">
            </a>
        </div>
        <div class="p-p-info">
            <a href="{{ url_for('privacy_policy') }}" target="_self">
            プライバシーポリシー
            </a>
        </div>
        <div class="copyrights">
            <small >&copy; mondo 2024</small>
        </div>
      </footer>

    <!-- JavaScriptファイル -->
    <script src="{{ url_for('static', filename='quiz_info.js') }}"></script>
</body>
</html>
