<!DOCTYPE html>
<html lang="ja">
<head>
    <!--文字エンコーディング-->
    <meta charset="UTF-8">
    <!--webページが画面幅に合わせて表示-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--ページタイトル-->
    <title>結果</title>
    <!--cssにリンク-->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="svg/x-icon">
    <!--フォントリンク-->
    <!--noto sans jp-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <!-- noto serif jp-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">

    <!-- adobe fonts のプロジェクトを読み込む-->
    <script>
        (function(d) {
          var config = {
            kitId: 'hdm6oce',
            scriptTimeout: 3000,
            async: true
          },
          h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
        })(document);
    </script>

    <!-- フォントをプリロード -->
    <link rel="preload" href="{{ url_for('static', filename='fonts/GenSekiGothic JP H.ttc') }}" as="font" type="font/ttf" crossorigin="anonymous">
    <!--ページのURL-->
    <a href="result.html"></a>
    
    <!--フォントの宣言-->
    <style>
        @font-face {
            font-family: 'GenSekiGothic JP H';
            src: url("{{ url_for('static', filename='fonts/GenSekiGothic JP H.ttc') }}") format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; /* フォールバックフォントで即表示し、利用可能になればスワップ */
        }
        @font-face {
            font-family: 'HOT-Gyoshokk-R';
            src: url("{{ url_for('static', filename='fonts/HOT-Gyoshokk-R/HOT-Gyoshokk-R.otf') }}") format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>

    <!-- google adsence -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905179670404848"
     crossorigin="anonymous"></script>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BRFNLZKC9G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
        
      gtag('config', 'G-BRFNLZKC9G');
    </script>
</head>
<body>
    <main>
        <h1 class="result_f">結果</h1>
        <!-- Flaskから渡された正答数と総問題数を表示 -->
        <div id="correct-answers">
            <p>{{ total }}問中、{{ correct }}問正解</p>
        </div>
        <div id="explanations">
            <h3 class="explanation_title">解説</h3>

            {% for question in answered_questions %}
            <div class="question-and-explanation">
                <!-- 問題番号を表示 -->
                <div class="question-order">
                    第{{ question.display_order }}問
                </div>

                <p class="question_t">Q. {{ question.text }}</p>
                <p class="choice_t">あなたの解答： {{ question.user_choice_text }}</p>
                <p class="explanation"> 解説： {{ question.explanation | safe }}</p>
            </div>
            {% endfor %}
          </div>

        <div class="transition">
            <h4 class="restart_f">クイズへの再挑戦はこちら</h4>
            <button id="restart_b">もう一度挑戦する</button>
            <h4 class="home_f">ホームへ戻るにはこちら</h4>
            <button id="home_b">ホームへ戻る</button>
        </div>
    </main>

    <footer class="footer">
        <div class="copyrights">
            <small >&copy; ngrjaku 2024</small>
        </div>
      </footer>
    
    <!--自作-->
    <script src="{{ url_for('static', filename='result.js') }}"></script>
</body>
</html>
