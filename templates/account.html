<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント | Mondo</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script type="module" src="{{ url_for('static', filename='account.js') }}"></script>
</head>
<body>
    <main class="account-page">
        <a class="account-back" href="{{ url_for('home') }}">← ホームに戻る</a>
        <h1>アカウント</h1>
        <p id="auth-message" role="status" aria-live="polite">認証を読み込んでいます。表示が変わらない場合は、通信状況を確認して再読み込みしてください。</p>
        <noscript><p>ログインには JavaScript を有効にしてください。</p></noscript>

        <section id="signed-out" hidden aria-label="ログインまたは新規登録">
            <p>クイズはログインせずに遊べます。</p>
            <form id="email-form">
                <label for="email">メールアドレス</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">パスワード</label>
                <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-policy" required>
                <p id="password-policy" role="status">パスワード条件を確認しています。</p>
                <div class="account-actions">
                    <button type="submit" name="action" value="login">ログイン</button>
                    <button type="submit" name="action" value="register">新規登録</button>
                </div>
            </form>
            <button type="button" id="google-login" class="google-login">Google でログイン・新規登録</button>
        </section>

        <section id="signed-in" hidden aria-label="ログイン中のアカウント">
            <p>ログイン中: <span id="account-name"></span></p>
            <button type="button" id="logout">ログアウト</button>
            <section id="password-section" hidden>
                <h2>パスワード変更</h2>
                <p id="change-policy">パスワード条件を確認しています。</p>
                <form id="change-password-form">
                    <label for="current-password">現在のパスワード</label>
                    <input id="current-password" type="password" autocomplete="current-password" required>
                    <label for="new-password">新しいパスワード</label>
                    <input id="new-password" type="password" autocomplete="new-password" aria-describedby="change-policy" required>
                    <label for="confirm-password">新しいパスワード（確認）</label>
                    <input id="confirm-password" type="password" autocomplete="new-password" required>
                    <button type="submit">パスワードを変更</button>
                </form>
            </section>
            <p id="google-password-notice" hidden>Google アカウントのパスワードは Google のアカウント設定で変更してください。</p>
            <section class="delete-account">
                <h2>アカウント削除</h2>
                <p>Firebase Authentication の Mondo アカウントを削除します。元に戻すことはできません。Google アカウント自体は削除されません。</p>
                <form id="delete-account-form">
                    <label for="delete-method">本人確認方法</label>
                    <select id="delete-method"></select>
                    <div id="delete-password-field" hidden>
                        <label for="delete-password">現在のパスワード</label>
                        <input id="delete-password" type="password" autocomplete="current-password">
                    </div>
                    <label><input id="delete-confirm" type="checkbox" required> アカウントの削除に同意します</label>
                    <button type="submit">アカウントを削除</button>
                </form>
            </section>
        </section>
    </main>
</body>
</html>
